name: Daily Cyber News

on:
  schedule:
    # GitHub travaille en UTC et retarde (voire saute) parfois les déclenchements programmés.
    # On programme donc plusieurs essais rapprochés : le premier qui démarre génère la page,
    # les suivants ne font rien (le script s'arrête si l'édition du jour existe déjà).
    #   03h47 UTC = 4h47 Paris (hiver) / 5h47 (été)
    #   04h07 UTC = 5h07 Paris (hiver) / 6h07 (été)
    #   04h37 UTC = 5h37 Paris (hiver) / 6h37 (été)
    #   05h07 UTC = 6h07 Paris (hiver) / 7h07 (été)
    #   05h37 UTC = 6h37 Paris (hiver) / 7h37 (été)
    - cron: "47 3 * * *"
    - cron: "7 4 * * *"
    - cron: "37 4 * * *"
    - cron: "7 5 * * *"
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Régénérer même si l'édition du jour existe déjà"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-cyber-news
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer l'édition du jour
        id: build
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python scripts/build.py --force
          else
            python scripts/build.py
          fi

      - name: Ajouter un bandeau si la génération a échoué
        if: steps.build.outcome == 'failure'
        run: python scripts/build.py --stale

      - name: Enregistrer les fichiers dans le dépôt
        if: steps.build.outputs.generated == 'true' || (steps.build.outcome == 'failure' && hashFiles('docs/index.html') != '')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          git diff --cached --quiet || git commit -m "Daily Cyber News $(TZ=Europe/Paris date +%F)"
          # Si le dépôt a changé entre-temps (ex. modification manuelle), on se remet à jour avant d'envoyer
          git pull --rebase origin main
          git push

      - name: Préparer la page
        if: steps.build.outputs.generated == 'true' || (steps.build.outcome == 'failure' && hashFiles('docs/index.html') != '')
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publier la page
        id: deployment
        if: steps.build.outputs.generated == 'true' || (steps.build.outcome == 'failure' && hashFiles('docs/index.html') != '')
        uses: actions/deploy-pages@v4

      - name: Signaler l'échec (pour recevoir un e-mail de GitHub)
        if: steps.build.outcome == 'failure'
        run: |
          echo "La génération a échoué : ouvrez l'étape « Générer l'édition du jour » pour lire l'erreur."
          exit 1
